# =============================================================================
# Grigori - Microservices Docker Compose
# =============================================================================
# A semantic code search system with separate services for scalability
#
# Architecture:
#   ┌─────────────┐     ┌─────────────┐
#   │ grigori-api │     │ grigori-mcp │
#   └──────┬──────┘     └──────┬──────┘
#          │                   │
#          └─────────┬─────────┘
#                    │ gRPC
#                    ↓
#          ┌───────────────────┐
#          │ grigori-embedder  │
#          └─────────┬─────────┘
#                    │
#                    ↓
#          ┌───────────────────┐
#          │ PostgreSQL        │
#          │ + pgvector        │
#          └───────────────────┘
#
# Usage:
#   Start all services:
#     docker compose up -d
#
#   View logs:
#     docker compose logs -f
#
#   Dashboard:
#     http://localhost:5151
#
#   API:
#     http://localhost:5151/api
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL with pgvector extension
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: grigori-postgres
    environment:
      POSTGRES_USER: grigori
      POSTGRES_PASSWORD: grigori
      POSTGRES_DB: grigori
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grigori -d grigori"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Embedding Service (gRPC) - Shared ONNX model for embeddings
  # ---------------------------------------------------------------------------
  embedder:
    build:
      context: .
      dockerfile: Dockerfile.embedder
    image: grigori-embedder:latest
    container_name: grigori-embedder
    ports:
      - "50051:50051"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:50051/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # API + Dashboard - REST API and Blazor UI
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: grigori-api:latest
    container_name: grigori-api
    ports:
      - "5151:5151"
    environment:
      - Grigori__EmbeddingProvider=grpc
      - Grigori__EmbeddingService__Address=http://embedder:50051
      - Grigori__Database__ConnectionString=Host=postgres;Database=grigori;Username=grigori;Password=grigori
    depends_on:
      postgres:
        condition: service_healthy
      embedder:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5151/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MCP Server - For Claude and other MCP clients (optional)
  # ---------------------------------------------------------------------------
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: grigori-mcp:latest
    container_name: grigori-mcp
    environment:
      - Grigori__EmbeddingProvider=grpc
      - Grigori__EmbeddingService__Address=http://embedder:50051
      - Grigori__Database__ConnectionString=Host=postgres;Database=grigori;Username=grigori;Password=grigori
    depends_on:
      postgres:
        condition: service_healthy
      embedder:
        condition: service_healthy
    profiles:
      - mcp
    # Note: MCP uses stdio transport, so no port mapping needed
    # Use: docker compose --profile mcp run --rm mcp
    stdin_open: true
    tty: true

volumes:
  postgres-data:
    name: grigori-postgres-data
