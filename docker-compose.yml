# =============================================================================
# Grigori Server - Docker Compose
# =============================================================================
# A shared semantic code search server with REST API and Dashboard
#
# Usage:
#   Start server:
#     docker compose up -d
#
#   View logs:
#     docker compose logs -f
#
#   Index a project via API:
#     curl -X POST http://localhost:5151/api/index -H "Content-Type: application/json" \
#       -d '{"path": "/projects/myproject"}'
#
#   Search:
#     curl -X POST http://localhost:5151/api/search -H "Content-Type: application/json" \
#       -d '{"query": "authentication logic", "limit": 10}'
#
#   Dashboard:
#     http://localhost:5151/dashboard
# =============================================================================

services:
  grigori:
    build:
      context: .
      dockerfile: Dockerfile
      target: full
    image: grigori:latest
    container_name: grigori
    ports:
      - "5151:5151"
    volumes:
      # Persist the search index
      - grigori-index:/data/index
      # Mount projects for indexing (add your own paths)
      # - /path/to/project1:/projects/project1:ro
      # - /path/to/project2:/projects/project2:ro
    environment:
      - GRIGORI__DASHBOARD__PORT=5151
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5151/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Slim variant - downloads model on first run (smaller image)
  # ---------------------------------------------------------------------------
  grigori-slim:
    build:
      context: .
      dockerfile: Dockerfile
      target: slim
    image: grigori:slim
    container_name: grigori-slim
    ports:
      - "5151:5151"
    volumes:
      # Persist models and index
      - grigori-data:/data
    environment:
      - GRIGORI__DASHBOARD__PORT=5151
    restart: unless-stopped
    profiles:
      - slim

volumes:
  grigori-index:
    name: grigori-index
  grigori-data:
    name: grigori-data
